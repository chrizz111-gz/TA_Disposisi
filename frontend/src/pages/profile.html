<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Profil Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

    <header class="topbar">
        <img src="../assets/logo.png" class="logo">
        <h2>DISPOSISI SURAT</h2>
    </header>

    <button id="toggleSidebar" class="hamburger" aria-label="Toggle Sidebar">III</button>

    <div class="wrapper">

        <aside id="sidebar" class="sidebar hidden">
            <a href="home.html" class="side-btn">BERANDA <img src="../assets/home.png"></a>
            <a href="profile.html" class="side-btn">PENGGUNA <img src="../assets/user.png"></a>
            <a href="suratmasuk.html" class="side-btn">SURAT MASUK <img src="../assets/in.png"></a>
            <a href="suratkeluar.html" class="side-btn">SURAT KELUAR <img src="../assets/out.png"></a>
            <a href="history.html" class="side-btn">RIWAYAT <img src="../assets/history.png"></a>
            <a href="usermanage.html" class="side-btn">MANAJEMEN AKUN <img src="../assets/users.png"></a>
        </aside>

        <main class="content">

            <div class="profile-container">

                <div class="profile-photo">
                    <div class="photo-circle">👤</div>
                </div>

                <div class="profile-card">
                    <h3>Informasi Profil</h3>

                    <div class="form-group">
                        <label>Nama</label>
                        <input type="text" id="nama" readonly>
                    </div>

                    <div class="form-group">
                        <label>Surel</label>
                        <input type="email" id="email" readonly>
                    </div>

                    <!-- Jabatan: readonly (sama seperti user) -->
                    <div class="form-group">
                        <label>Jabatan</label>
                        <input type="text" id="jabatanStatic" readonly>
                    </div>

                    <!-- Section Ganti Logo (hanya admin) -->
                    <div id="logoSection" class="logo-section" style="display:none;">
                        <h4 class="logo-section-title">Ganti Logo Aplikasi</h4>
                        <div class="logo-preview-wrapper">
                            <img id="logoPreview" src="../assets/logo.png" alt="Logo Preview" class="logo-preview">
                        </div>
                        <div class="logo-upload-area">
                            <label for="logoFile" class="logo-file-label">
                                📁 Pilih File Logo
                            </label>
                            <input type="file" id="logoFile" accept=".png,.jpg,.jpeg" style="display:none;">
                            <span id="logoFileName" class="logo-file-name">Belum ada file dipilih</span>
                        </div>
                        <button class="btn-upload-logo" id="btnUploadLogo" disabled>Unggah Logo</button>
                        <p id="logoStatus" class="logo-status"></p>
                    </div>

                    <button class="btn-logout" id="btnLogout">Keluar</button>
                </div>

            </div>

        </main>
    </div>

    <div id="customAlert" class="custom-alert" style="display:none;">
        <div class="alert-box">
            <p id="alertMessage"></p>
            <button onclick="closeAlertProfile()">OK</button>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/logo.js"></script>
    <script src="../js/sidebar.js"></script>
    <script>
        (function () {
            const user = getUser();
            if (!user) { window.location.href = "login.html"; return; }

            document.getElementById("nama").value = user.name || "-";
            document.getElementById("email").value = user.email || "-";

            // Tampilkan jabatan sebagai teks readonly (sama seperti user)
            const jabatans = user.jabatans || [];
            const jabatanText = jabatans
                .map(j => j.toUpperCase())
                .join(" / ");
            document.getElementById("jabatanStatic").value = jabatanText || "-";

            // Tampilkan section logo jika admin
            const isAdmin = jabatans.some(j => j.toLowerCase() === "admin");
            if (isAdmin) {
                document.getElementById("logoSection").style.display = "block";

                // Load preview logo saat ini
                const logoPreview = document.getElementById("logoPreview");
                fetch(BASE_URL + "/logo")
                    .then(res => {
                        if (res.ok) {
                            logoPreview.src = BASE_URL + "/logo?t=" + Date.now();
                        }
                    })
                    .catch(() => { });

                // File input handler
                const logoFile = document.getElementById("logoFile");
                const logoFileName = document.getElementById("logoFileName");
                const btnUpload = document.getElementById("btnUploadLogo");

                logoFile.addEventListener("change", function () {
                    if (logoFile.files.length > 0) {
                        const file = logoFile.files[0];
                        logoFileName.textContent = file.name;
                        btnUpload.disabled = false;

                        // Preview gambar yang dipilih
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            logoPreview.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    } else {
                        logoFileName.textContent = "Belum ada file dipilih";
                        btnUpload.disabled = true;
                    }
                });

                // Upload handler
                btnUpload.addEventListener("click", async function () {
                    if (!logoFile.files.length) return;

                    const file = logoFile.files[0];

                    // Validasi ukuran client-side
                    if (file.size > 2 * 1024 * 1024) {
                        document.getElementById("logoStatus").textContent = "❌ Ukuran file maksimal 2MB";
                        document.getElementById("logoStatus").style.color = "#e05555";
                        return;
                    }

                    btnUpload.disabled = true;
                    btnUpload.textContent = "Mengunggah...";
                    document.getElementById("logoStatus").textContent = "";

                    const formData = new FormData();
                    formData.append("logo", file);

                    try {
                        const token = getToken();
                        const res = await fetch(BASE_URL + "/admin/logo/upload", {
                            method: "POST",
                            headers: { "Authorization": "Bearer " + token },
                            body: formData
                        });

                        const data = await res.json();

                        if (res.ok) {
                            document.getElementById("logoStatus").textContent = "✅ " + data.message;
                            document.getElementById("logoStatus").style.color = "#3CC15F";

                            // Update logo di header halaman ini
                            const headerLogo = document.querySelector("header.topbar img.logo");
                            if (headerLogo) {
                                headerLogo.src = BASE_URL + "/logo?t=" + Date.now();
                            }

                            // Reset file input
                            logoFile.value = "";
                            logoFileName.textContent = "Belum ada file dipilih";
                        } else {
                            document.getElementById("logoStatus").textContent = "❌ " + (data.error || "Gagal upload");
                            document.getElementById("logoStatus").style.color = "#e05555";
                        }
                    } catch (err) {
                        document.getElementById("logoStatus").textContent = "❌ Terjadi kesalahan jaringan";
                        document.getElementById("logoStatus").style.color = "#e05555";
                    }

                    btnUpload.textContent = "Unggah Logo";
                    // Button stays disabled until new file is selected
                });
            }

            let redirectUrl = "";
            function showAlertProfile(msg, url = "") {
                document.getElementById("alertMessage").innerText = msg;
                document.getElementById("customAlert").style.display = "flex";
                redirectUrl = url;
            }
            window.closeAlertProfile = function () {
                document.getElementById("customAlert").style.display = "none";
                if (redirectUrl) window.location.href = redirectUrl;
            };

            document.getElementById("btnLogout").addEventListener("click", () => logout());
        })();
    </script>

</body>

</html>
