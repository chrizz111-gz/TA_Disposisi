<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disposisi Detail Surat Keluar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/disposisi_keluar.css">
</head>

<body>

    <header class="topbar">
        <img src="../assets/logo.png" class="logo" alt="Logo">
        <h2>DISPOSISI SURAT</h2>
    </header>

    <div class="container-detail">
        <h2 class="title">DETAIL SURAT KELUAR</h2>

        <div class="detail-wrapper">

            <!-- KOLOM KIRI -->
            <div class="left-panel">
                <div class="card surat-preview">
                    <h3>Surat Keluar</h3>
                    <div class="surat-grid">
                        <div class="surat-col">
                            <div class="item-row">
                                <span class="label">Nomor Surat</span>
                                <span class="separator">:</span>
                                <span class="value" id="valNoSurat">-</span>
                            </div>
                            <div class="item-row">
                                <span class="label">Kode</span>
                                <span class="separator">:</span>
                                <span class="value" id="valKode">-</span>
                            </div>
                            <div class="item-row">
                                <span class="label">Tanggal</span>
                                <span class="separator">:</span>
                                <span class="value" id="valTanggal">-</span>
                            </div>
                        </div>
                        <div class="surat-col">
                            <div class="item-row">
                                <span class="label">Dari</span>
                                <span class="separator">:</span>
                                <span class="value">SMK NEGERI 2 SINGOSARI</span>
                            </div>
                            <div class="item-row">
                                <span class="label">Tujuan</span>
                                <span class="separator">:</span>
                                <span class="value" id="valTujuan">-</span>
                            </div>
                            <div class="item-row">
                                <span class="label">Perihal</span>
                                <span class="separator">:</span>
                                <span class="value" id="valPerihal">-</span>
                            </div>
                            <div class="item-row">
                                <span class="label">Lampiran</span>
                                <span class="separator">:</span>
                                <span class="value">1 Berkas PDF</span>
                            </div>
                        </div>
                    </div>

                    <div class="lampiran-box" id="lampiranBox">
                        <p>Memuat lampiran...</p>
                    </div>

                    <div class="left-button-area" style="margin-top:20px">
                        <button class="btn-back" id="btnKembali">Dismiss</button>
                    </div>
                </div>
            </div>

            <!-- KOLOM KANAN -->
            <div class="right-panel">
                <div class="card">
                    <h3>Informasi Disposisi</h3>

                    <div class="form-group">
                        <label>Status Surat</label>
                        <select id="statusSurat">
                            <option value="">- Pilih Status Surat -</option>
                            <option value="terima">Terima</option>
                            <option value="tolak">Tolak</option>
                        </select>
                    </div>

                    <div id="formTerima" class="hidden">
                        <div class="form-group">
                            <label>Catatan</label>
                            <textarea id="catatanTerima" placeholder="Masukkan catatan..."></textarea>
                        </div>
                    </div>

                    <div id="formTolak" class="hidden">
                        <div class="form-group">
                            <label>Catatan Penolakan</label>
                            <textarea id="catatanTolak" placeholder="Masukkan alasan penolakan..."></textarea>
                        </div>
                    </div>

                    <div class="button-group hidden" id="buttonArea">
                        <button class="btn-kembali" id="btnTeruskan">← Teruskan</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="customAlert" class="custom-alert" style="display:none;">
        <div class="alert-box">
            <p id="alertMessage"></p>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/logo.js"></script>
    <script src="../js/disposisi_keluar.js"></script>

</body>

</html>
